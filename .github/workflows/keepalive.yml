name: Backend keep-alive

# Pings the live backend regularly to generate enough CPU/network activity
# to stay clear of Oracle Cloud's Always Free idle-instance reclaim policy
# (reclaims compute instances sitting under 20% CPU + network utilization
# for a full 7-day period). Every 15 minutes is comfortably more than
# enough margin, and GitHub Actions doesn't guarantee exact timing on
# schedules this frequent anyway — occasional delays don't matter here.
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping backend health endpoint
        run: |
          curl -sf -m 15 https://fplquant.duckdns.org/health || echo "Health check failed (non-fatal — just a keep-alive ping, not a monitor)"
